<!-- start custom head snippets -->
{%- comment -%}
  Meta, Open Graph, Twitter cards and JSON-LD all live in _includes/seo.html.
  This file used to emit its own copies of all of them, which meant every page
  shipped two conflicting og:title / og:image / twitter:card tags. Keep this
  file to fonts and icons only.
{%- endcomment -%}

<!-- Fonts for the page-redesign design system (.rd-page) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#0f172a">
<!-- end custom head snippets -->
